name: PR8 inspect

on:
  push:
    branches: [chatgpt/pr8-directives-furnace]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PR8 combat hooks
        shell: bash
        run: |
          set -e
          echo '=== crit and damage ==='
          grep -RIn --exclude-dir=node_modules -E 'critChance\(|critFactor\(|armorPenAdd\(|applyPlayerCombatHit\(|rawDamage|sourceModuleId|currentTargetId' src/game/combat.ts src/game/coreCombat.ts src/game/coreTargeting.ts src/game/workshop.ts | head -n 260 || true
          echo '=== regen repair ==='
          grep -RIn --exclude-dir=node_modules -E 'shopShieldRegen|shopHullRepair|regen|repair|NANO_LATHE|GRAV_|salvageMarkBonus|sensorTargetingModifier|choirTap' src/game/combat.ts src/game/coreCombat.ts | head -n 260 || true
          echo '=== fragment RNG ==='
          grep -RIn --exclude-dir=node_modules -E 'FRAGMENT_DROP|fragmentChanceMult|eligibleFragmentBlueprints|rollEnemyPartDrop' src/game/combat.ts || true
          echo '=== launch/reset furnace ==='
          grep -RIn --exclude-dir=node_modules -E 'endFurnaceSortie|createEmptyFurnaceState|furnace =|resources\.heat = 0|clearDirectives|directiveOffer' src/game/tick.ts src/game/actions.ts src/game/save.ts | head -n 220 || true
