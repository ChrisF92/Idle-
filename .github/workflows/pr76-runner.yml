name: PR76 temporary runner

on:
  pull_request:
    branches:
      - chatgpt/pr75-combat-curve-density-range
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.head_ref, 'chatgpt/pr76-') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract and run PR76 patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/pr76-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = src[start:end]
          body = [line[10:] if line.startswith('          ') else line for line in body]
          Path('/tmp/pr76_apply.py').write_text('\n'.join(body) + '\n')
          PY
          python /tmp/pr76_apply.py
      - name: Apply PR76 validation fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/game/progression.ts')
          text = p.read_text()
          old = """    const used = (state.process?.purchased?.length ?? 0) > 0 || state.ai.purchased.length > 0
    return used || (
      careerHighestSector(state) >= ACT1_CADENCE.process &&
      (state.prestige.prestigeCount ?? 0) >= PROCESS_MIN_REBUILDS &&
      state.research.unlocked.length >= PROCESS_MIN_RESEARCH
    )
"""
          new = """    const used = (state.process?.purchased?.length ?? 0) > 0 || state.ai.purchased.length > 0
    const researchProgress =
      state.research.unlocked.length +
      Object.values(state.hiveResearch?.completed ?? {}).filter((n) => n > 0).length
    return used || (
      careerHighestSector(state) >= ACT1_CADENCE.process &&
      (state.prestige.prestigeCount ?? 0) >= PROCESS_MIN_REBUILDS &&
      researchProgress >= PROCESS_MIN_RESEARCH
    )
"""
          if old not in text: raise SystemExit('Process mastery gate target missing')
          p.write_text(text.replace(old, new))

          c = Path('src/game/catalog.ts')
          text = c.read_text()
          marker = 'function sectorBonusDropEntries'
          start = text.index(marker)
          end = text.index('\n}\n', start) + 3
          block = text[start:end]
          block = block.replace('if (sector >= 16) {', 'if (sector >= __PR76_FIRST__) {', 1)
          block = block.replace('if (sector >= 12) {', 'if (sector >= 16) {', 1)
          block = block.replace('if (sector >= __PR76_FIRST__) {', 'if (sector >= 12) {', 1)
          c.write_text(text[:start] + block + text[end:])
          PY
      - name: Test
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee pr76-test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist failing diagnostics
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pr76-test-output.txt
          git commit -m "chore: capture PR76 test failures"
          git push origin HEAD:${{ github.head_ref }}
          exit 1
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated PR76
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr76-apply.yml
          git rm -f .pr76-trigger pr76-test-output.txt || true
          git add src
          git commit -m "feat: spread Act 1 systems and strengthen Rebuild growth"
          git push origin HEAD:${{ github.head_ref }}
