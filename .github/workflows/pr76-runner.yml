name: PR76 temporary runner

on:
  pull_request:
    branches:
      - chatgpt/pr75-combat-curve-density-range
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/pr76-system-cadence-growth' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract and run PR76 patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/pr76-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = src[start:end]
          # The embedded script is indented ten spaces under the YAML block.
          body = [line[10:] if line.startswith('          ') else line for line in body]
          Path('/tmp/pr76_apply.py').write_text('\n'.join(body) + '\n')
          PY
          python /tmp/pr76_apply.py
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated PR76
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr76-apply.yml
          git add src
          git commit -m "feat: spread Act 1 systems and strengthen Rebuild growth"
          git push origin HEAD:${{ github.head_ref }}
