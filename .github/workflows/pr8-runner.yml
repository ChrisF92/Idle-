name: PR8 implementation runner

on:
  push:
    branches: [chatgpt/pr8-directives-furnace]

permissions:
  contents: write

concurrency:
  group: pr8-implementation-runner
  cancel-in-progress: true

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR8 branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/pr8-directives-furnace
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare PR8 transform
        run: |
          python scripts/pr8_prepare.py
          python scripts/pr8_prepare2.py
          python scripts/pr8_prepare3.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/pr8_prepare4.py')
          text = p.read_text()
          text = text.replace("FURNACE_UI_TEST = r'''", 'FURNACE_UI_TEST = r"""', 1)
          text = text.replace("\n'''\nwrite('src/game/gdd-furnace-ui.test.tsx', FURNACE_UI_TEST)", "\n\"\"\"\nwrite('src/game/gdd-furnace-ui.test.tsx', FURNACE_UI_TEST)", 1)
          text = text.replace("INSPECT_TEST = r'''", 'INSPECT_TEST = r"""', 1)
          text = text.replace("\n'''\nwrite('src/game/inspect.test.ts', INSPECT_TEST)", "\n\"\"\"\nwrite('src/game/inspect.test.ts', INSPECT_TEST)", 1)
          p.write_text(text)
          PY
          python scripts/pr8_prepare4.py
          python scripts/pr8_prepare5.py
          python scripts/pr8_prepare6.py
          python scripts/pr8_prepare7.py
      - name: Apply PR8 transform
        run: python scripts/pr8_apply.py
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Focused PR8 tests
        shell: bash
        run: |
          set +e
          npx vitest run src/game/pr8-directives-furnace.test.ts src/game/gdd-directives.test.ts src/game/gdd-furnace.test.ts src/game/furnace.test.ts --reporter=verbose > pr8-focused.log 2>&1
          code=$?
          cat pr8-focused.log
          exit $code
      - name: Test
        shell: bash
        run: |
          set +e
          npm test > pr8-test.log 2>&1
          code=$?
          tail -n 700 pr8-test.log
          exit $code
      - name: Build
        run: npm run build
      - name: Build Pages
        run: npm run build:pages
      - name: Commit verified PR8 tree
        run: |
          rm scripts/pr8_apply.py scripts/pr8_prepare.py scripts/pr8_prepare2.py scripts/pr8_prepare3.py scripts/pr8_prepare4.py scripts/pr8_prepare5.py scripts/pr8_prepare6.py scripts/pr8_prepare7.py
          rm .github/workflows/pr8-runner.yml
          rm -f .github/workflows/pr8-probe.yml
          git config user.name "ChatGPT PR8 Implementation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "PR8: Directives and Furnace"
          git push origin HEAD:chatgpt/pr8-directives-furnace
