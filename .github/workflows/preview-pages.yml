name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: github.event.action != 'closed'
        run: npm ci

      - name: Apply focused PR7 correction
        if: github.event.action != 'closed'
        run: |
          python scripts/pr7_correction.py
          python scripts/pr7_correction_fix.py
          python scripts/pr7_correction_fix3.py

      - name: Verify focused correction
        if: github.event.action != 'closed'
        run: |
          npm run lint
          npm test
          npm run build
          npm run build:pages

      - name: Commit verified correction and remove runner
        if: github.event.action != 'closed'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git show aecd874a4e032840e6f75e7045e9a620dbca69ad:.github/workflows/preview-pages.yml > .github/workflows/preview-pages.yml
          rm scripts/pr7_correction.py scripts/pr7_correction_fix.py scripts/pr7_correction_fix3.py
          git config user.name "ChatGPT PR7 Correction"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR7: close audited hostiles and Boss blockers"
          git push origin HEAD:${HEAD_REF}
