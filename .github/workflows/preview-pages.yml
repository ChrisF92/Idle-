name: Deploy PR preview

# Live preview per PR at:
#   https://chrisf92.github.io/Idle-/pr-preview/pr-<number>/
# Same GitHub Pages site as production — no external hosting account.
# Requires the same Pages + workflow-permission settings as deploy-pages.yml.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: github.event.action != 'closed'
        run: npm ci

      - name: Test
        if: github.event.action != 'closed'
        run: npm test

      - name: Build preview
        if: github.event.action != 'closed'
        env:
          PAGES_BASE: /Idle-/pr-preview/pr-${{ github.event.number }}/
        run: npm run build

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
