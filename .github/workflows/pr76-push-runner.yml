name: PR76 branch validator

on:
  push:
    branches:
      - chatgpt/pr76-system-cadence-growth

permissions:
  contents: write

env:
  CI: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr76-system-cadence-growth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply PR76 source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/pr76-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = src[start:end]
          body = [line[10:] if line.startswith('          ') else line for line in body]
          Path('/tmp/pr76_apply.py').write_text('\n'.join(body) + '\n')
          PY
          python /tmp/pr76_apply.py
      - name: Test
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee pr76-test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist failing test diagnostics
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pr76-test-output.txt
          git commit -m "chore: capture PR76 test failures"
          git push origin HEAD:chatgpt/pr76-system-cadence-growth
          exit 1
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated PR76
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout origin/chatgpt/pr75-combat-curve-density-range -- package.json
          git rm -f .github/workflows/pr76-apply.yml .github/workflows/pr76-push-runner.yml
          git rm -f scripts/pr76-test-runner.mjs scripts/pr76-test-migrate.mjs scripts/pr76-test-migrate-2.mjs scripts/pr76-test-migrate-3.mjs scripts/pr76-final-fixes.mjs
          git rm -f .pr76-trigger pr76-test-output.txt || true
          git add src package.json
          git commit -m "feat: spread Act 1 systems and strengthen Rebuild growth"
          git push origin HEAD:chatgpt/pr76-system-cadence-growth
