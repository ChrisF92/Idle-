name: PR8 dependency probe

on:
  push:
    branches: [chatgpt/pr8-directives-furnace]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Directive and Furnace dependencies
        shell: bash
        run: |
          set -e
          echo '=== furnace imports/calls ==='
          grep -RIn --exclude-dir=node_modules -E "from './furnace'|from '../game/furnace'|from '../../game/furnace'|furnace[A-Z]|FURNACE_|ASH_PER_HEAT|setFurnace|convertAshToHeat|runFurnaceManager|applyFurnacePreset" src | head -n 1000 || true
          echo '=== directive imports/calls ==='
          grep -RIn --exclude-dir=node_modules -E "from './directives'|from '../game/directives'|from '../../game/directives'|directive[A-Z]|DIRECTIVE_|queueDirectiveOffer|chooseDirective|clearDirectives" src | head -n 1000 || true
          echo '=== save hydrate furnace/directives ==='
          grep -n -E 'furnace|directives|directiveOffer' src/game/save.ts | head -n 300 || true
          echo '=== tick/action reset points ==='
          grep -n -E 'furnace|heat|choirAsh|directive' src/game/tick.ts src/game/actions.ts | head -n 600 || true
