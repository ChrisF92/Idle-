name: PR76 apply cadence and growth

on:
  pull_request:
    branches:
      - chatgpt/pr75-combat-curve-density-range
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/pr76-system-cadence-growth' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply PR76 implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement: {label}')
              return text.replace(old, new)

          # Central cadence constants make future playtest tuning cheap.
          cadence = """/** PR76: one authoritative Act 1 unlock cadence. */
          export const ACT1_CADENCE = {
            foundry: 6,
            codex: 10,
            rebuild: 12,
            reliquary: 16,
            yard: 20,
            routeB: 24,
            furnace: 28,
            research: 34,
            process: 42,
            protocols: 52,
            echo: 62,
            specialists: 68,
            tasks: 72,
            capital: 75,
            reinforce: 80,
          } as const

          export const NETWORK_CADENCE = {
            yield: 4,
            loom: 9,
            strikeRelay: 12,
            wardRelay: 15,
            yieldRelay: 20,
            loomRelay: 24,
            archive: 34,
            archiveRelay: 38,
            strikeLattice: 44,
            wardLattice: 48,
          } as const

          export const YARD_MIN_REBUILDS = 2
          export const PROCESS_MIN_REBUILDS = 2
          export const PROCESS_MIN_RESEARCH = 1
          export const ECHO_MIN_PROTOCOL_RANKS = 1

          /** Original first print was S2; preserve print spacing after Foundry moves. */
          export const FOUNDRY_PRINT_SHIFT = ACT1_CADENCE.foundry - 2
          """
          write('src/game/cadence.ts', cadence)

          # progression.ts
          p = read('src/game/progression.ts')
          p = rep(p, "import { noteHighestSector } from './playtest'", "import { noteHighestSector } from './playtest'\nimport {\n  ACT1_CADENCE,\n  ECHO_MIN_PROTOCOL_RANKS,\n  PROCESS_MIN_REBUILDS,\n  PROCESS_MIN_RESEARCH,\n  YARD_MIN_REBUILDS,\n} from './cadence'", 'progression cadence import')
          p = rep(p, "/** Rebuild hangar becomes available mid–Act 1 (sector 4). Keep in sync with catalog.PRESTIGE_MIN_SECTOR. */\nexport const PRESTIGE_MIN_SECTOR = 4", "/** Rebuild is the first major meta-layer, after Cores/Network/Foundry have had room to breathe. */\nexport const PRESTIGE_MIN_SECTOR = ACT1_CADENCE.rebuild\nexport const FOUNDRY_UNLOCK_SECTOR = ACT1_CADENCE.foundry", 'prestige/foundry constants')
          replacements = {
            "id: 'reliquary',\n    requiresSectorEver: 3,": "id: 'reliquary',\n    requiresSectorEver: ACT1_CADENCE.reliquary,",
            "id: 'furnace',\n    requiresSectorEver: 5,": "id: 'furnace',\n    requiresSectorEver: ACT1_CADENCE.furnace,",
            "id: 'yard',\n    requiresSectorEver: 0,": "id: 'yard',\n    requiresSectorEver: ACT1_CADENCE.yard,",
            "id: 'protocols',\n    requiresSectorEver: 18,": "id: 'protocols',\n    requiresSectorEver: ACT1_CADENCE.protocols,",
            "id: 'echo',\n    requiresSectorEver: 22,": "id: 'echo',\n    requiresSectorEver: ACT1_CADENCE.echo,",
            "id: 'process',\n    requiresSectorEver: 0,": "id: 'process',\n    requiresSectorEver: ACT1_CADENCE.process,",
            "id: 'specialists',\n    requiresSectorEver: 51,": "id: 'specialists',\n    requiresSectorEver: ACT1_CADENCE.specialists,",
            "id: 'tasks',\n    requiresSectorEver: 72,": "id: 'tasks',\n    requiresSectorEver: ACT1_CADENCE.tasks,",
            "id: 'capital',\n    requiresSectorEver: 75,": "id: 'capital',\n    requiresSectorEver: ACT1_CADENCE.capital,",
            "id: 'reinforce',\n    requiresSectorEver: 80,": "id: 'reinforce',\n    requiresSectorEver: ACT1_CADENCE.reinforce,",
            "id: 'research',\n    requiresSectorEver: 7,": "id: 'research',\n    requiresSectorEver: ACT1_CADENCE.research,",
            "id: 'codex',\n    requiresSectorEver: 6,": "id: 'codex',\n    requiresSectorEver: ACT1_CADENCE.codex,",
            "id: 'core',\n    requiresSectorEver: 8,": "id: 'core',\n    requiresSectorEver: ACT1_CADENCE.research + 2,",
            "id: 'ai',\n    requiresSectorEver: 0,": "id: 'ai',\n    requiresSectorEver: ACT1_CADENCE.process,",
            "id: 'prestige',\n    requiresSectorEver: 4,": "id: 'prestige',\n    requiresSectorEver: ACT1_CADENCE.rebuild,",
          }
          for old,new in replacements.items():
              p = rep(p, old, new, old)
          p = rep(p, "description: 'Clear sector 1. Unlocks Process.'", "description: 'Clear sector 1. Starts banking Process Points for later automation.'", 'first blood copy')
          p = rep(p, "description: 'Clear sector 3. Reliquary is open.'", "description: 'Clear sector 3. Shard signatures are now detectable.'", 'chip drawer copy')
          p = rep(p, "description: 'Clear sector 7. Research is open.'", "description: 'Clear sector 7. Archive telemetry begins accumulating.'", 'archive copy')

          old_unlock = """  if (systemId === 'foundry') {
    return careerHighestSector(state) >= 2
  }
  if (systemId === 'yard' || systemId === 'slag') {
    return (state.prestige.prestigeCount ?? 0) >= 1
  }
  if (systemId === 'capital') {
    return careerHighestSector(state) >= 75 && taskListComplete(state)
  }
  if (systemId === 'logs') {
    return true
  }
  if (systemId === 'ai' || systemId === 'process') {
    return state.meta.aiUnlocked || state.meta.completedAchievements.length > 0
  }
  if (systemId === 'codex') {
    return careerHighestSector(state) >= 6
  }
"""
          new_unlock = """  if (systemId === 'foundry') {
    const used =
      Object.values(state.foundry?.recipeLevels ?? {}).some((n) => n > 0) ||
      Object.values(state.foundry?.materials ?? {}).some((n) => n > 0) ||
      (state.foundry?.equipped?.length ?? 0) > 0
    return used || careerHighestSector(state) >= ACT1_CADENCE.foundry
  }
  if (systemId === 'slag') {
    return (state.prestige.prestigeCount ?? 0) >= 1 || Object.keys(state.prestige.matterShop ?? {}).length > 0
  }
  if (systemId === 'yard') {
    const used = (state.yard?.cells ?? []).some((cell) => Boolean(cell.buildingId))
    return used || (
      careerHighestSector(state) >= ACT1_CADENCE.yard &&
      (state.prestige.prestigeCount ?? 0) >= YARD_MIN_REBUILDS
    )
  }
  if (systemId === 'capital') {
    return careerHighestSector(state) >= ACT1_CADENCE.capital && taskListComplete(state)
  }
  if (systemId === 'logs') {
    return true
  }
  if (systemId === 'ai' || systemId === 'process') {
    const used = (state.process?.purchased?.length ?? 0) > 0 || state.ai.purchased.length > 0
    return used || (
      careerHighestSector(state) >= ACT1_CADENCE.process &&
      (state.prestige.prestigeCount ?? 0) >= PROCESS_MIN_REBUILDS &&
      state.research.unlocked.length >= PROCESS_MIN_RESEARCH
    )
  }
  if (systemId === 'codex') {
    return careerHighestSector(state) >= ACT1_CADENCE.codex
  }
  if (systemId === 'research') {
    const used =
      state.research.unlocked.length > 0 ||
      Object.values(state.hiveResearch?.completed ?? {}).some((n) => n > 0)
    return used || careerHighestSector(state) >= ACT1_CADENCE.research
  }
  if (systemId === 'protocols') {
    const used = Boolean(state.protocols?.activeId) || Object.values(state.protocols?.ranks ?? {}).some((n) => n > 0)
    return used || careerHighestSector(state) >= ACT1_CADENCE.protocols
  }
  if (systemId === 'echo') {
    const protocolRanks = Object.values(state.protocols?.ranks ?? {}).reduce((sum, n) => sum + n, 0)
    const used =
      Boolean(state.echo?.activeId) ||
      (state.echo?.tree?.length ?? 0) > 0 ||
      Object.values(state.echo?.clears ?? {}).some((n) => n > 0)
    return used || (
      careerHighestSector(state) >= ACT1_CADENCE.echo &&
      protocolRanks >= ECHO_MIN_PROTOCOL_RANKS
    )
  }
"""
          p = rep(p, old_unlock, new_unlock, 'system unlock special cases')

          old_req = """  if (systemId === 'foundry') {
    return 'Clear sector 2'
  }
  if (systemId === 'yard' || systemId === 'slag') {
    return 'Rebuild once'
  }
  if (systemId === 'capital') {
    return 'Clear sector 75 · finish the Task List'
  }
  if (systemId === 'logs') {
    return null
  }
  if (systemId === 'ai' || systemId === 'process') {
    return 'Complete First Blood (clear sector 1)'
  }
  if (systemId === 'codex') {
    return 'Clear sector 6'
  }
"""
          new_req = """  if (systemId === 'foundry') {
    return `Clear sector ${ACT1_CADENCE.foundry}`
  }
  if (systemId === 'slag') {
    return 'Rebuild once'
  }
  if (systemId === 'yard') {
    return `Clear sector ${ACT1_CADENCE.yard} · Rebuild ${YARD_MIN_REBUILDS} times`
  }
  if (systemId === 'capital') {
    return `Clear sector ${ACT1_CADENCE.capital} · finish the Task List`
  }
  if (systemId === 'logs') {
    return null
  }
  if (systemId === 'ai' || systemId === 'process') {
    return `Clear sector ${ACT1_CADENCE.process} · Rebuild ${PROCESS_MIN_REBUILDS} times · complete any Research`
  }
  if (systemId === 'codex') {
    return `Clear sector ${ACT1_CADENCE.codex}`
  }
  if (systemId === 'echo') {
    return `Clear sector ${ACT1_CADENCE.echo} · clear any Protocol once`
  }
"""
          p = rep(p, old_req, new_req, 'unlock requirement copy')
          p = rep(p, "if (ever >= 6 && !state.meta.codexUnlocked)", "if (ever >= ACT1_CADENCE.codex && !state.meta.codexUnlocked)", 'codex grant')
          write('src/game/progression.ts', p)

          # sectors.ts: later Route B so it is a phase change, not another early popup.
          s = read('src/game/sectors.ts')
          s = rep(s, "import type { CombatPushMode, SectorRoute } from './types'", "import type { CombatPushMode, SectorRoute } from './types'\nimport { ACT1_CADENCE } from './cadence'", 'sector cadence import')
          s = rep(s, "/** B-side opens when sector 8 is cleared (entering 9). */\nexport const ROUTE_B_UNLOCK_CLEARED = 8", "/** B-side is a mid-game route choice, after the first meta/industry layers are learned. */\nexport const ROUTE_B_UNLOCK_CLEARED = ACT1_CADENCE.routeB", 'route B gate')
          write('src/game/sectors.ts', s)

          # furnace.ts
          f = read('src/game/furnace.ts')
          f = rep(f, "import { noteFrontierIntervention } from './frontier'", "import { noteFrontierIntervention } from './frontier'\nimport { ACT1_CADENCE } from './cadence'", 'furnace cadence import')
          f = rep(f, "export const FURNACE_UNLOCK_SECTOR = 5", "export const FURNACE_UNLOCK_SECTOR = ACT1_CADENCE.furnace", 'furnace gate')
          write('src/game/furnace.ts', f)

          # network.ts: keep one evolving system alive for a long time instead of dumping bars at S2.
          n = read('src/game/network.ts')
          n = rep(n, "import { foundryNetworkFillMult } from './foundryBonuses'", "import { foundryNetworkFillMult } from './foundryBonuses'\nimport { NETWORK_CADENCE } from './cadence'", 'network cadence import')
          net_repls = {
            "id: 'yield',\n    name: 'Yield',\n    blurb: 'Salvage from wrecks, plus a trickle of scrap.',\n    requiresSectorEver: 2,": "id: 'yield',\n    name: 'Yield',\n    blurb: 'Salvage from wrecks, plus a trickle of scrap.',\n    requiresSectorEver: NETWORK_CADENCE.yield,",
            "id: 'loom',\n    name: 'Loom',\n    blurb: 'Faster drone manufacture and Foundry crafts.',\n    requiresSectorEver: 2,": "id: 'loom',\n    name: 'Loom',\n    blurb: 'Faster drone manufacture and Foundry crafts.',\n    requiresSectorEver: NETWORK_CADENCE.loom,",
            "id: 'archive',\n    name: 'Archive',\n    blurb: 'A trickle of Research data.',\n    requiresSectorEver: 7,": "id: 'archive',\n    name: 'Archive',\n    blurb: 'A trickle of Research data.',\n    requiresSectorEver: NETWORK_CADENCE.archive,",
            "id: 'strike-relay',\n    name: 'Strike Relay',\n    blurb: 'Infrastructure behind Strike.',\n    requiresSectorEver: 8,": "id: 'strike-relay',\n    name: 'Strike Relay',\n    blurb: 'Infrastructure behind Strike.',\n    requiresSectorEver: NETWORK_CADENCE.strikeRelay,",
            "id: 'ward-relay',\n    name: 'Ward Relay',\n    blurb: 'Infrastructure behind Ward.',\n    requiresSectorEver: 9,": "id: 'ward-relay',\n    name: 'Ward Relay',\n    blurb: 'Infrastructure behind Ward.',\n    requiresSectorEver: NETWORK_CADENCE.wardRelay,",
            "id: 'yield-relay',\n    name: 'Yield Relay',\n    blurb: 'Infrastructure behind Yield.',\n    requiresSectorEver: 12,": "id: 'yield-relay',\n    name: 'Yield Relay',\n    blurb: 'Infrastructure behind Yield.',\n    requiresSectorEver: NETWORK_CADENCE.yieldRelay,",
            "id: 'loom-relay',\n    name: 'Loom Relay',\n    blurb: 'Infrastructure behind Loom.',\n    requiresSectorEver: 13,": "id: 'loom-relay',\n    name: 'Loom Relay',\n    blurb: 'Infrastructure behind Loom.',\n    requiresSectorEver: NETWORK_CADENCE.loomRelay,",
            "id: 'archive-relay',\n    name: 'Archive Relay',\n    blurb: 'Infrastructure behind Archive.',\n    requiresSectorEver: 16,": "id: 'archive-relay',\n    name: 'Archive Relay',\n    blurb: 'Infrastructure behind Archive.',\n    requiresSectorEver: NETWORK_CADENCE.archiveRelay,",
            "id: 'strike-lattice',\n    name: 'Strike Lattice',\n    blurb: 'Infrastructure behind Strike Relay.',\n    requiresSectorEver: 20,": "id: 'strike-lattice',\n    name: 'Strike Lattice',\n    blurb: 'Infrastructure behind Strike Relay.',\n    requiresSectorEver: NETWORK_CADENCE.strikeLattice,",
            "id: 'ward-lattice',\n    name: 'Ward Lattice',\n    blurb: 'Infrastructure behind Ward Relay.',\n    requiresSectorEver: 22,": "id: 'ward-lattice',\n    name: 'Ward Lattice',\n    blurb: 'Infrastructure behind Ward Relay.',\n    requiresSectorEver: NETWORK_CADENCE.wardLattice,",
          }
          for old,new in net_repls.items(): n = rep(n, old, new, old)
          n = n.replace('Opens after you clear sector 2.', 'Opens after you clear sector 4.', 1)
          n = n.replace('Opens after you clear sector 2.', 'Opens after you clear sector 9.', 1)
          n = n.replace('Opens with Research at sector 7.', 'Opens with Research at sector 34.')
          n = n.replace('Opens at sector 20.', 'Opens at sector 44.')
          n = n.replace('Opens at sector 22.', 'Opens at sector 48.')
          n = n.replace('Before the Furnace, racks are jury-rigged with scrap. After sector 5, Heat from Choir-ash welds proper racks.', 'Before the Furnace, racks are jury-rigged with scrap. Once the Furnace opens, Heat from Choir-ash welds proper racks.')
          n = n.replace('Opens with the Furnace at sector 5.', 'Opens with the Furnace at sector 28.')
          write('src/game/network.ts', n)

          # catalog.ts: shift the print ladder with Foundry and make Rebuild the first true exponential layer.
          c = read('src/game/catalog.ts')
          c = rep(c, "import { careerHighestSector, isSystemUnlocked } from './progression'", "import { careerHighestSector, isSystemUnlocked } from './progression'\nimport { ACT1_CADENCE, FOUNDRY_PRINT_SHIFT } from './cadence'", 'catalog cadence import')
          c = rep(c, "description: 'Permanent +8% combat damage (deep ranks; extra ranks +45% of base).',\n    costPm: 3,\n    maxRank: 25,\n    damageBonus: 0.08,", "description: 'Permanent combat multiplier. Each rank compounds at ×1.15.',\n    costPm: 3,\n    maxRank: 25,\n    damageBonus: 0.15,", 'slag edge')
          c = rep(c, "description: 'Permanent +12% base production (deep ranks).',\n    costPm: 3,\n    maxRank: 25,\n    productionBonus: 0.12,", "description: 'Permanent production multiplier. Each rank compounds at ×1.15.',\n    costPm: 3,\n    maxRank: 25,\n    productionBonus: 0.15,", 'slag forge')
          c = c.replace("description: 'Permanent +50 hull (deep ranks).',", "description: 'Permanent hull reinforcement. Flat gains accelerate across ranks.',")
          c = c.replace('hullBonus: 50,', 'hullBonus: 80,', 1)
          c = c.replace("description: 'Permanent +40 shield capacity on the flagship (deep ranks).',", "description: 'Permanent shield bank. Flat gains accelerate across ranks.',")
          c = c.replace('shieldBonus: 40,', 'shieldBonus: 65,', 1)
          c = c.replace("description:\n      '+20% drone power per rank (extra ranks +45% of base). Black-bar stations with fewer bodies.',", "description:\n      'Permanent drone-power multiplier. Each rank compounds at ×1.12; black-bar stations with fewer bodies.',")
          c = c.replace('dronePowerBonus: 0.2,', 'dronePowerBonus: 0.12,', 1)

          old_frag = """ * S2–S4: 4 fragments (2/1/1)
 * S5–S10: 6 fragments (3/2/1)
 * S11–S17: 9 fragments (4/3/2)
 * S18+: long-farm 12 fragments (5/4/3)
 */
export function printFragmentNeeds(unlockSector: number): Pick<BlueprintRecipe, 'casing' | 'core' | 'lens'> {
  if (unlockSector <= 4) return { casing: 2, core: 1, lens: 1 }
  if (unlockSector <= 10) return { casing: 3, core: 2, lens: 1 }
  if (unlockSector <= 17) return { casing: 4, core: 3, lens: 2 }
  return { casing: 5, core: 4, lens: 3 }
}
"""
          new_frag = """ * First 3 Foundry sectors: 4 fragments (2/1/1)
 * Next 6 sectors: 6 fragments (3/2/1)
 * Next 7 sectors: 9 fragments (4/3/2)
 * Later prints: long-farm 12 fragments (5/4/3)
 */
export function printFragmentNeeds(unlockSector: number): Pick<BlueprintRecipe, 'casing' | 'core' | 'lens'> {
  if (unlockSector <= ACT1_CADENCE.foundry + 2) return { casing: 2, core: 1, lens: 1 }
  if (unlockSector <= ACT1_CADENCE.foundry + 8) return { casing: 3, core: 2, lens: 1 }
  if (unlockSector <= ACT1_CADENCE.foundry + 15) return { casing: 4, core: 3, lens: 2 }
  return { casing: 5, core: 4, lens: 3 }
}
"""
          c = rep(c, old_frag, new_frag, 'fragment tiers')
          c = rep(c, "export function modulePrintSector(moduleId: string): number {\n  return Math.max(0, getModule(moduleId)?.requiresSectorEver ?? 0)\n}", "export function modulePrintSector(moduleId: string): number {\n  const original = Math.max(0, getModule(moduleId)?.requiresSectorEver ?? 0)\n  return Math.max(ACT1_CADENCE.foundry, original + FOUNDRY_PRINT_SHIFT)\n}", 'print sector shift')
          c = c.replace('if (sector >= 8) {', 'if (sector >= 12) {', 1)
          c = c.replace('if (sector >= 12) {', 'if (sector >= 16) {', 1)
          c = c.replace('if (sector >= 18) {', 'if (sector >= 22) {', 1)
          old_early = """export function earlyCareerFragmentMult(careerSector: number): number {
  const n = Math.max(0, careerSector)
  if (n <= 5) return 3.25
  if (n <= 10) return 2.15
  if (n <= 17) return 1.35
  return 1
}
"""
          new_early = """export function earlyCareerFragmentMult(careerSector: number): number {
  const n = Math.max(0, careerSector)
  if (n <= ACT1_CADENCE.foundry + 3) return 3.25
  if (n <= ACT1_CADENCE.foundry + 8) return 2.15
  if (n <= ACT1_CADENCE.foundry + 15) return 1.35
  return 1
}
"""
          c = rep(c, old_early, new_early, 'fragment taper')

          old_scale = """/** Diminishing stack: rank 1 = 1× base; each extra rank adds 45% of base. */
export function matterShopEffectScale(rank: number): number {
  if (rank <= 0) return 0
  return 1 + 0.45 * (rank - 1)
}
"""
          new_scale = """/** Legacy soft stacking used by Challenge-shop and probability-like effects. */
export function matterShopEffectScale(rank: number): number {
  if (rank <= 0) return 0
  return 1 + 0.45 * (rank - 1)
}

/** True prestige growth: a per-rank percentage compounds multiplicatively. */
export function matterShopRankMultiplier(perRank: number, rank: number): number {
  return Math.pow(1 + Math.max(0, perRank), Math.max(0, rank))
}

export function matterShopCompoundBonus(perRank: number, rank: number): number {
  return matterShopRankMultiplier(perRank, rank) - 1
}

/** Accelerating flat-stat ranks without turning a flat stat into a percentage stat. */
export function matterShopFlatScale(rank: number, growth = 0.12): number {
  const r = Math.max(0, rank)
  if (r <= 0) return 0
  if (growth <= 0) return r
  return (Math.pow(1 + growth, r) - 1) / growth
}
"""
          c = rep(c, old_scale, new_scale, 'matter scaling helpers')

          c = rep(c, "let mult = 1 + prestigeMatter * 0.006 + challengePoints * 0.01", "// Banking is only a fallback. Spending Rebuild Matter should dominate.\n  let mult = 1 + prestigeMatter * 0.001 + challengePoints * 0.01", 'banked damage PM')
          c = rep(c, "if (def?.damageBonus) mult += def.damageBonus * matterShopEffectScale(rank)\n  }\n  mult += challengeStackDamageBonus", "if (def?.damageBonus) mult *= matterShopRankMultiplier(def.damageBonus, rank)\n  }\n  mult += challengeStackDamageBonus", 'matter damage multiply')
          c = rep(c, "let mult = 1 + prestigeMatter * 0.006\n  for (const [id, rank] of Object.entries(matterShop)) {\n    const def = getMatterShopItem(id)\n    if (def?.productionBonus) mult += def.productionBonus * matterShopEffectScale(rank)\n  }", "// Banking is deliberately tiny; invested Matter is the progression engine.\n  let mult = 1 + prestigeMatter * 0.001\n  for (const [id, rank] of Object.entries(matterShop)) {\n    const def = getMatterShopItem(id)\n    if (def?.productionBonus) mult *= matterShopRankMultiplier(def.productionBonus, rank)\n  }", 'matter production multiply')

          old_momentum = """  const fromPrestige = Math.min(0.5, Math.max(0, prestigeCount) * 0.04)
  const fromAscension = Math.min(0.5, Math.max(0, ascensionCount) * 0.08)
  return fromPrestige + fromAscension
"""
          new_momentum = """  const fromPrestige = Math.pow(1.08, Math.max(0, prestigeCount))
  const fromAscension = Math.pow(1.18, Math.max(0, ascensionCount))
  return fromPrestige * fromAscension - 1
"""
          c = rep(c, old_momentum, new_momentum, 'damage momentum')
          old_prod_mom = """  const fromPrestige = Math.min(0.42, Math.max(0, prestigeCount) * 0.03)
  const fromAscension = Math.min(0.4, Math.max(0, ascensionCount) * 0.06)
  return fromPrestige + fromAscension
"""
          new_prod_mom = """  const fromPrestige = Math.pow(1.06, Math.max(0, prestigeCount))
  const fromAscension = Math.pow(1.15, Math.max(0, ascensionCount))
  return fromPrestige * fromAscension - 1
"""
          c = rep(c, old_prod_mom, new_prod_mom, 'production momentum')
          c = rep(c, "if (bonus) total += bonus * matterShopEffectScale(rank)\n  }\n  return total\n}\n\nexport function matterShopShieldBonus", "if (bonus) total += bonus * matterShopFlatScale(rank)\n  }\n  return total\n}\n\nexport function matterShopShieldBonus", 'hull scale')
          c = rep(c, "export function matterShopShieldBonus(matterShop: Record<string, number>): number {\n  let total = 0\n  for (const [id, rank] of Object.entries(matterShop)) {\n    const bonus = getMatterShopItem(id)?.shieldBonus ?? 0\n    if (bonus) total += bonus * matterShopEffectScale(rank)\n  }", "export function matterShopShieldBonus(matterShop: Record<string, number>): number {\n  let total = 0\n  for (const [id, rank] of Object.entries(matterShop)) {\n    const bonus = getMatterShopItem(id)?.shieldBonus ?? 0\n    if (bonus) total += bonus * matterShopFlatScale(rank)\n  }", 'shield scale')
