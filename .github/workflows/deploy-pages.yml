name: Deploy GitHub Pages

# Production site on the gh-pages branch (repo root).
# A developer-only-capable build is assembled under dev-lab/ with isolated storage.
# PR previews share that branch under pr-preview/ — see preview-pages.yml.
# Requires: Settings → Pages → Source: Deploy from branch → gh-pages / (root)
#           Settings → Actions → General → Workflow permissions: Read and write

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build for GitHub Pages
        env:
          PAGES_BASE: /Idle-/
        run: npm run build

      - name: Build isolated Dev Lab
        env:
          PAGES_BASE: /Idle-/dev-lab/
          VITE_HIVEWORKS_DEVTOOLS: '1'
          VITE_HIVEWORKS_STORAGE_NAMESPACE: dev-lab
        run: npx vite build --outDir dist-dev-lab

      - name: Add Dev Lab to deployment
        run: |
          mkdir -p dist/dev-lab
          cp -R dist-dev-lab/. dist/dev-lab/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Keep PR preview folders under pr-preview/.
          keep_files: true
          commit_message: 'Deploy production from ${{ github.sha }}'
