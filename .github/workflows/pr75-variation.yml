name: PR75 variation validate

on:
  pull_request:
    branches:
      - cursor/continuous-combat-frontier-08a7

permissions:
  contents: write

jobs:
  variation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr75-combat-curve-density-range
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply wave variation
        run: python .github/pr75_variation.py
      - run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit variation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: vary authored wave order across sector cycles"
          git push origin HEAD:chatgpt/pr75-combat-curve-density-range
